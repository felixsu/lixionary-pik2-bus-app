# Rate limiting zone for pik2bus API
limit_req_zone $binary_remote_addr zone=pik2bus_api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name tj-api.lixionary.com;

    # Allow Healthcheck endpoint without rate limiting
    location /health {
        proxy_pass http://127.0.0.1:8020/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main Proxy Location with Rate Limiting and SSE Support
    location / {
        # Enforce rate limit zone with a burst capacity of 20 requests
        limit_req zone=pik2bus_api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (SSE) specific proxy settings:
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Disable buffering & caching so SSE streams render immediately!
        proxy_buffering off;
        proxy_cache off;
        
        # Set large read timeout to prevent Nginx from severing idle SSE connections
        proxy_read_timeout 24h;
    }
}

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pik2-bus-backend
    restart: unless-stopped
    ports:
      - "8020:8020"
    environment:
      - PORT=8020
      - DB_PATH=/app/data/pik2_bus.db
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - API_KEY=${API_KEY}
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  backend-data:
    driver: local
